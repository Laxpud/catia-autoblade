name: FreeCAD measurements

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/autoblade/**'
      - 'scripts/golden/**'
      - 'scripts/*freecad*.sh'
      - 'tests/fixtures/golden/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/freecad-measurements.yml'
  pull_request:
    paths:
      - 'src/autoblade/**'
      - 'scripts/golden/**'
      - 'scripts/*freecad*.sh'
      - 'tests/fixtures/golden/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/freecad-measurements.yml'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 初期观察环境稳定性；任何状态都不代表人类对几何适用性的批准。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install pinned FreeCAD environment
        run: bash scripts/setup-freecad-ci.sh
      - name: Collect model measurements and performance
        env:
          QT_QPA_PLATFORM: offscreen
        run: dbus-run-session -- bash scripts/check-freecad-measurements.sh output/freecad-ci
      - name: Upload measurements for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/freecad-ci/
            !output/freecad-ci/venv/
          retention-days: 14
          if-no-files-found: warn
