[project]
name = "autoblade"
dynamic = ["version"]
description = "AutoBlade command-line tool for creating blade models with CATIA"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Laxpud", email = "mi.shore@foxmail.com" }
]
keywords = ["autoblade", "catia", "automation", "blade", "cad"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pywin32==311; sys_platform == 'win32'",
    "typer>=0.24,<0.25",
    "questionary>=2.1,<3",
    "pydantic>=2.12,<3",
    "tomlkit>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
autoblade = "autoblade.cli:app"
autoblade-create = "autoblade.cli:create_entrypoint"
autoblade-batch = "autoblade.cli:batch_entrypoint"

[project.urls]
Homepage = "https://github.com/Laxpud/catia-autoblade"
Repository = "https://github.com/Laxpud/catia-autoblade"
Documentation = "https://github.com/Laxpud/catia-autoblade/tree/main/docs"
Issues = "https://github.com/Laxpud/catia-autoblade/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/autoblade/__init__.py"

[tool.hatch.build]
exclude = [
    "/.git",
    "/.pytest_cache",
    "/.test-tmp-*",
    "/.uv",
    "/.venv",
    "/build",
    "/dist",
    "/output",
    "**/__pycache__",
    "**/*.CATPart",
    "**/*.CATProduct",
    "**/*.FCStd*",
    "**/*.log",
    "**/*.stp",
    "!/tests/fixtures/golden/multi-sharp-89/catia.stp",
    "!/tests/fixtures/golden/single-sharp/catia.stp",
    "!/tests/fixtures/golden/single-blunt/catia.stp",
    "!/tests/fixtures/golden/multi-blunt/catia.stp",
    "!/tests/fixtures/golden/affine-05/catia.stp",
    "!/tests/fixtures/golden/affine-17/catia.stp",
    "!/tests/fixtures/golden/affine-25/catia.stp",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoblade"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows/checks.yml",
    "/.github/workflows/freecad-measurements.yml",
    "/AGENTS.md",
    "/CONTEXT.md",
    "/LICENSE",
    "/README.md",
    "/TODO.md",
    "/config.toml",
    "/docs",
    "/input/README.md",
    "/input/airfoils/airfoil1_sharp.csv",
    "/input/airfoils/airfoil1_sharp_dense_1000.csv",
    "/input/airfoils/airfoil2_sharp.csv",
    "/input/airfoils/airfoil3_sharp.csv",
    "/input/airfoils/naca0012_sharp.csv",
    "/input/airfoils/sc1095.csv",
    "/input/airfoils/sc1095_sharp.csv",
    "/input/airfoils/sd7032_sharp.csv",
    "/input/blade_sections/blade_sections-1.csv",
    "/input/blade_sections/blade_sections-2.csv",
    "/input/blade_sections/blade_sections-3.csv",
    "/input/blade_sections/blade_sections-4.csv",
    "/input/blade_sections/blade_sections-5.csv",
    "/input/blade_sections/blade_sections-multi-airfoil.csv",
    "/input/blade_sections/blade_sections-naca.csv",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
extend-exclude = ["src/autoblade/_vendor"]

# FreeCAD 使用独立 Python，Child 共用模块不能被 Host 3.14 formatter 改为新语法。
[tool.ruff.per-file-target-version]
"src/autoblade/adapters/cad/freecad/runner.py" = "py310"
"src/autoblade/adapters/cad/freecad/protocol.py" = "py310"
"src/autoblade/adapters/cad/freecad/probe.py" = "py310"
"scripts/golden/measure.py" = "py310"
"scripts/golden/fixture.py" = "py310"
"scripts/golden/candidate_contract.py" = "py310"
